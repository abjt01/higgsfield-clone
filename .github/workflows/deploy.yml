name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy to Vercel
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Vercel's own Git integration already deploys on push. This workflow is
      # the alternative for when you want migrations to run as a gated step
      # before the deploy, rather than hoping they were run by hand. It skips
      # itself cleanly when the secrets are not configured, so a fresh clone
      # does not show a permanently red check.
      - name: Check configuration
        id: cfg
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set — skipping. Vercel's Git integration"
            echo "handles deploys on its own, which is the simpler default."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "VERCEL_TOKEN is set but DATABASE_URL_UNPOOLED is not."
            echo "Migrations would be skipped and the deploy would 500 on any"
            echo "route that touches the database. Refusing to deploy."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.cfg.outputs.configured == 'true'
        run: npm ci

      # Runs over the direct connection: DDL through a pooler is unreliable.
      - name: Run migrations
        if: steps.cfg.outputs.configured == 'true'
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npm run db:migrate

      - name: Deploy
        if: steps.cfg.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
